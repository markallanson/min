[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[package]
name = "min"
version.workspace = true
edition.workspace = true
description = "a minimal terminal agentic coding harness — everything is a plugin"

[dependencies]
min-core = { path = "crates/min-core" }
min-repl = { path = "crates/min-repl" }
min-llm = { path = "crates/min-llm" }
min-agent = { path = "crates/min-agent" }
min-usage = { path = "crates/min-usage" }
min-tools-fs = { path = "crates/min-tools-fs" }
min-tools-shell = { path = "crates/min-tools-shell" }
min-tools-clock = { path = "crates/min-tools-clock" }
min-context = { path = "crates/min-context" }
min-herdr = { path = "crates/min-herdr" }
min-session = { path = "crates/min-session" }
min-subagents = { path = "crates/min-subagents" }

[[bin]]
name = "min"
path = "src/main.rs"

[dev-dependencies]
min-usage = { path = "crates/min-usage" }

[profile.release]
lto = true
strip = true
